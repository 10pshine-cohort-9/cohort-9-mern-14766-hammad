# SonarQube Scanner Configuration

# Project Metadata
sonar.projectKey=cohort-9-mern-14766-hammad
sonar.projectName=Notes Management App (MERN)
sonar.projectVersion=1.0.0

# Encoding
sonar.sourceEncoding=UTF-8

# Source Directories
sonar.sources=backend/src,frontend/src

# Test Directories
sonar.tests=backend/test,frontend/src/__tests__

# Test File Patterns
sonar.test.inclusions=backend/test/**/*.test.js,frontend/src/__tests__/**/*.test.js,frontend/src/__tests__/**/*.test.jsx

# Exclusions from Code Analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.nyc_output/**,frontend/src/setupTests.js,backend/test/setup.js

# Coverage Reports
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Language Settings
sonar.language=js
